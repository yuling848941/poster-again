[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fontfx"
version = "0.1.0"
description = "Pure-Pillow text effects: gradient, image-filled, glowing, shadowed and stroked text"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["Pillow>=9.2"]
keywords = ["pillow", "text", "gradient", "glow", "shadow", "stroke", "poster"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Text Processing :: Fonts",
]

[project.optional-dependencies]
# 渐变走向量化实现；不装也能跑（自动退化为纯 Pillow 路径）
numpy = ["numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]
